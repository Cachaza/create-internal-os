name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Matches the pinned starter's packageManager contract.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm run test:smoke
